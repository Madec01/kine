# Construit le site et le publie sur GitHub Pages à chaque poussée sur main.
# Prérequis : Settings → Pages → Source = « GitHub Actions », puis déclarer
# les secrets VITE_FIREBASE_API_KEY et VITE_FIREBASE_PROJECT_ID (Settings →
# Secrets and variables → Actions). Sans eux, le site publié fonctionne sans
# sauvegarde en ligne (données sur l'appareil uniquement).
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_LIBRARY_KEY: ${{ secrets.VITE_LIBRARY_KEY }}
      - uses: actions/configure-pages@v5
        with:
          # Bascule Pages en mode « GitHub Actions » si le dépôt est encore en mode branche.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
